<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1b1238" />
  <title>Leinwand · Wer ist es?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="deco" aria-hidden="true">
    <!-- Teal-Dreiecke oben links -->
    <svg style="top:150px;left:30px" width="120" height="220" viewBox="0 0 120 220" fill="none">
      <path d="M60 0 L96 56 H24 Z" fill="#6fc3c1"/>
      <path d="M60 82 L96 138 H24 Z" fill="#6fc3c1"/>
      <path d="M60 164 L96 220 H24 Z" fill="#6fc3c1"/>
    </svg>
    <!-- Kreisraster oben rechts -->
    <svg style="top:150px;right:34px;opacity:0.35" width="220" height="180" viewBox="0 0 220 180" fill="none" stroke="#212222" stroke-width="2">
      <g>
        <circle cx="20" cy="20" r="13"/><circle cx="60" cy="20" r="13"/><circle cx="100" cy="20" r="13"/><circle cx="140" cy="20" r="13"/><circle cx="180" cy="20" r="13"/>
        <circle cx="20" cy="60" r="13"/><circle cx="60" cy="60" r="13"/><circle cx="100" cy="60" r="13"/><circle cx="140" cy="60" r="13"/><circle cx="180" cy="60" r="13"/>
        <circle cx="20" cy="100" r="13"/><circle cx="60" cy="100" r="13"/><circle cx="100" cy="100" r="13"/><circle cx="140" cy="100" r="13"/><circle cx="180" cy="100" r="13"/>
        <circle cx="20" cy="140" r="13"/><circle cx="60" cy="140" r="13"/><circle cx="100" cy="140" r="13"/><circle cx="140" cy="140" r="13"/><circle cx="180" cy="140" r="13"/>
      </g>
    </svg>
    <!-- Halbton-Punkte unten links -->
    <svg style="bottom:36px;left:40px;opacity:0.85" width="180" height="120" viewBox="0 0 180 120" fill="#6fc3c1">
      <g>
        <circle cx="10" cy="10" r="5"/><circle cx="34" cy="10" r="5"/><circle cx="58" cy="10" r="5"/>
        <circle cx="10" cy="34" r="5"/><circle cx="34" cy="34" r="5"/><circle cx="58" cy="34" r="5"/><circle cx="82" cy="34" r="5"/>
        <circle cx="10" cy="58" r="5"/><circle cx="34" cy="58" r="5"/><circle cx="58" cy="58" r="5"/><circle cx="82" cy="58" r="5"/><circle cx="106" cy="58" r="5"/>
        <circle cx="34" cy="82" r="5"/><circle cx="58" cy="82" r="5"/><circle cx="82" cy="82" r="5"/><circle cx="106" cy="82" r="5"/><circle cx="130" cy="82" r="5"/>
        <circle cx="58" cy="106" r="5"/><circle cx="82" cy="106" r="5"/><circle cx="106" cy="106" r="5"/><circle cx="130" cy="106" r="5"/><circle cx="154" cy="106" r="5"/>
      </g>
    </svg>
    <!-- Zickzack unten rechts -->
    <svg style="bottom:44px;right:40px;opacity:0.6" width="260" height="90" viewBox="0 0 260 90" fill="none" stroke="#212222" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
      <path d="M6 30 L46 6 L86 30 L126 6 L166 30 L206 6 L246 30"/>
      <path d="M6 66 L46 42 L86 66 L126 42 L166 66 L206 42 L246 66"/>
    </svg>
  </div>

  <div class="screen-shell">
    <div class="screen-top">
      <h1 class="screen-title" id="screenTitle">Wer ist es?<small id="screenSub"></small></h1>
      <div class="screen-count" id="screenCount">0 Spieler</div>
    </div>

    <div class="screen-main">
      <!-- Lobby -->
      <div id="sLobby" class="lobby hidden">
        <div class="card qr-card">
          <div id="qrcode"></div>
          <div class="join-url" id="joinUrl"></div>
          <div class="hint">Mit der Handy-Kamera scannen</div>
        </div>
        <div class="lobby-right">
          <h2>Scanne und mach mit</h2>
          <p class="lead"><span id="lobbyCount">0</span> sind schon dabei</p>
          <div class="player-chips" id="playerChips"></div>
        </div>
      </div>

      <!-- Frage -->
      <div id="sQuestion" class="screen-question hidden">
        <div class="q-big" id="sQBig"></div>
        <div class="timer-wrap" id="timerWrap">
          <svg class="ring" width="240" height="240" viewBox="0 0 260 260" aria-hidden="true">
            <circle class="ring-bg" cx="130" cy="130" r="110" stroke-width="16"></circle>
            <circle id="ringFg" class="ring-fg" cx="130" cy="130" r="110" stroke-width="16"></circle>
            <text id="ringNum" class="timer-num" x="130" y="130" text-anchor="middle" dominant-baseline="central">30</text>
          </svg>
        </div>
        <div class="opt-grid" id="optGrid"></div>
        <div style="text-align:center;margin-top:18px;color:var(--text-dim);font-family:var(--font-display);font-size:1.2rem;" id="answerCount">0 Antworten</div>
      </div>

      <!-- Leaderboard -->
      <div id="sBoard" class="board hidden">
        <h2 id="boardTitle">Leaderboard</h2>
        <div id="boardRows"></div>
      </div>

      <!-- Ende -->
      <div id="sEnded" class="board hidden">
        <h2>Das war's! Die Sieger</h2>
        <div class="podium" id="podium"></div>
        <div id="boardRest" style="margin-top:30px;"></div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="shared.js"></script>
  <script src="screen.js"></script>
</body>
</html>
